plugins { id 'com.android.application' }

def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
def keystoreFile = file('pong-release.keystore')
def signingStorePassword = System.getenv('PONG_KEYSTORE_PASSWORD')
def signingAlias = System.getenv('PONG_KEY_ALIAS')
def signingKeyPassword = System.getenv('PONG_KEY_PASSWORD')
def hasSigningKey = keystoreFile.exists() && signingStorePassword && signingAlias && signingKeyPassword

android {
    namespace 'com.ayuu.instapong'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ayuu.instapong'
        minSdk 26
        targetSdk 35
        versionCode runNumber
        versionName "0.1.${runNumber}"
    }

    signingConfigs {
        release {
            if (hasSigningKey) {
                storeFile keystoreFile
                storePassword signingStorePassword
                keyAlias signingAlias
                keyPassword signingKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasSigningKey) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
