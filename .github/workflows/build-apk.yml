name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Configure signing key
        env:
          KEYSTORE_B64: ${{ secrets.PONG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "PONG_KEYSTORE_B64 repository secret is required for updateable builds."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 --decode > app/pong-release.keystore

      - name: Build signed release APK
        env:
          PONG_KEYSTORE_PASSWORD: ${{ secrets.PONG_KEYSTORE_PASSWORD }}
          PONG_KEY_ALIAS: ${{ secrets.PONG_KEY_ALIAS }}
          PONG_KEY_PASSWORD: ${{ secrets.PONG_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: instagram-pong-bot-v${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 90

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Instagram Pong Bot v${{ github.run_number }}
          body: "Version code: ${{ github.run_number }}"
          make_latest: true
          files: app/build/outputs/apk/release/app-release.apk
